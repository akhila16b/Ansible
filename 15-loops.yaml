- name: Install packages
  hosts: local
  connection: local
  become: yes
  vars:
    packages:
    - nginx
    - git
    - mysql
  tasks:
  - name: install packages
    package:
      name: "{{ item }}"
      state: present
    loop: "{{ packages }}"

- name: Install packages
  hosts: local
  connection: local
  become: yes
  vars:
    packages:
    - { name: 'nginx', state: 'absent' }
    - { name: 'mysql', state: 'absent'}
    - { name: 'git', state: 'present'}
  tasks:
  - name: install
    package:
      name: "{{ item.name }}"
      state: "{{ item.state }}"
    loop: "{{ packages }}"
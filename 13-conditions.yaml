- name: print os is redha or not
  hosts: local
  become: yes
  connection: local
  tasks:
  - name: install nginx in Redhat
    dnf:
      state: present
      name: nginx
    when: ansible_facts.os_family == "Redhat"

  - name: install nginx in debian
    apt:
      state: present
      name: nginx
    when: ansible_facts.os_family == "Debian"
- name: demo on filters
  hosts: local
  connection: local
  vars:
    topics: Linux, Shell, Ansible
    names:
    - Akhila
    - Bankuru
    topic: ANSIBLE
    duration: "4"
    
  tasks:
    - name: print the name
      debug:
        msg: "Hi, {{ person_name | default('Ramesh') }}"

    - name: convert string to list
      debug:
        msg: "Topics are {{ topics | split (',') }}"

    - name: conert list to string
      debug:
        msg: "Full name {{ names | join (' ') }}"

    - name: convert to lower case
      debug:
        msg: "Topic: {{ topic| lower }}"

    - name: convert from dtring to item.name
      debug: 
        msg: " Duration is {{ duration | int }}"
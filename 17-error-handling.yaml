- name: create user
  hosts: local
  connection: local
  become: yes
  tasks:
    - name: check roboshop user exist or not
      command: id roboshop
      register: user_output
      ignore_errors: true

    - name: print the output
      debug:
        msg: "{{ user_output }}"

    - name: create user
      command: useradd roboshop
      when: user_output.rc ! = 0


#if you run command and take output into a variable in ansible, we can use register keyword
#rc == 0 -> SUCCESS
#rc !=0 -> FAILURE